<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0e10"><title>ぴた秒 ONLINE</title>
<style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#f4f3fa;background:#0d0e10}*{box-sizing:border-box}body{margin:0}main{max-width:520px;padding:22px 18px 65px;margin:auto}.langs{display:flex;justify-content:flex-end;gap:8px}.langs button{background:none;color:#a9adbb;border:0;cursor:pointer;font-size:12px;padding:6px}.langs button.on{color:#e7ff59}h1{font-size:36px;letter-spacing:-.04em;margin:16px 0 5px}h1 span,.lime{color:#e7ff59}.eyebrow{font-size:12px;color:#a8a9b7;letter-spacing:.1em}.panel{background:#191b1f;border:1px solid #383d43;border-radius:19px;padding:21px;margin:18px 0}.panel h2{font-size:20px;margin:0 0 15px;color:#e7ff59}.panel p{color:#b3b5c1;font-size:13px;line-height:1.65}.field{margin:12px 0}label{display:block;font-size:12px;color:#c3c5ce;margin-bottom:7px}input,select{background:#111316;color:#fff;border:1px solid #52545b;border-radius:10px;padding:12px;width:100%;font-size:16px}button{font-family:inherit}.primary,.secondary{cursor:pointer;border:0;border-radius:12px;padding:14px 17px;font-size:15px;font-weight:800}.primary{background:#e7ff59;color:#16170e}.secondary{background:#303238;color:#f4f3fa}.primary:disabled,.secondary:disabled{opacity:.4;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.actions button{flex:1}.muted{color:#a9adbb;font-size:13px;line-height:1.6}.hide{display:none!important}.code{font-size:31px;font-weight:900;letter-spacing:.18em;color:#e7ff59}.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}.person{border-bottom:1px solid #303238;padding:9px 0;font-size:14px}.pill{font-size:11px;color:#e7ff59;border:1px solid #666e35;border-radius:6px;padding:4px 7px}.orb{display:block;width:min(70vw,260px);height:min(70vw,260px);border-radius:50%;margin:25px auto 16px;border:7px solid #e7ff59;background:#e7ff59;color:#18190f;font-size:27px;font-weight:900;cursor:pointer;touch-action:manipulation}.orb.stop,.orb.exploded{background:#ff525e;border-color:#ff525e;color:white}.orb:disabled{opacity:.63;cursor:default}.orb.exploded:disabled{opacity:1}.big{font-size:48px;text-align:center;font-weight:900;color:#e7ff59;min-height:65px;font-variant-numeric:tabular-nums}.center{text-align:center}.entry{border-bottom:1px solid #383d43;padding:12px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:13px}.entry b{text-align:right}.error{color:#ff8a90;font-size:13px;line-height:1.5;min-height:18px}.link{color:#e7ff59}.compact{font-size:13px}.toplink{display:inline-block;color:#a8abb8;font-size:13px;text-decoration:none;margin:5px 0 0}.switch{display:flex;gap:9px}.switch>*{flex:1}.time-controls{display:flex;gap:6px;margin-top:8px}.time-controls button{flex:1;background:#303238;color:white;border:1px solid #555;border-radius:9px;padding:10px 0;cursor:pointer}.gamecard{width:100%;text-align:left;background:#191b1f;color:#e7ff59;border:1px solid #383d43;border-radius:14px;padding:14px 17px;margin:5px 0;font-weight:800;font-size:16px;cursor:pointer}.gamecard.active{border-color:#e7ff59}.gamecard:disabled{opacity:1;cursor:default}.gamecard:disabled:not(.active){opacity:.68}.readonly-field{opacity:.85}.gamecard small{display:block;margin-top:6px;color:#b2b4c1;font-size:12px;font-weight:400}.hint{font-size:13px;color:#aeb0c1;text-align:center;min-height:20px}.subline{color:#a9abbd;font-size:12px}.notice{border:1px solid #434633;background:#1b2017;padding:12px;border-radius:11px;font-size:12px;line-height:1.6;margin:14px 0}
/* Local Ver.12 shared play-screen look */
main{max-width:520px;padding:24px 18px 55px}
.panel{border-radius:20px}
#playPanel{background:transparent;border:0;padding:0;margin:25px auto;text-align:center}
#gameHeading{font-size:29px;font-weight:800;margin:12px 0}
#turnLine{color:#e7ff59;font-weight:700;letter-spacing:.09em}
#readout{font-size:clamp(42px,9vw,68px);min-height:1.3em;margin:30px 0 0}
.orb{width:min(67vw,270px);height:min(67vw,270px);border:8px solid #e7ff59;margin:20px auto 18px;font-size:30px}
.orb:active{transform:scale(.96)}
#turnHint{line-height:1.7}
#playActions{justify-content:center;margin-top:25px}
#resultPanel{background:transparent;border:0;padding:0}
#resultPanel h2{font-size:29px}
.entry{display:flex;align-items:center;justify-content:space-between}
.entry span{min-width:90px}
</style></head><body><main>
<div class="langs"><button id="ja" class="on">日本語</button><button id="en">EN</button></div>
<h1 id="logo">ぴた<span>秒</span></h1><div class="eyebrow">ONLINE</div>
<a class="toplink" href="./index.html" id="localLink">← ローカル版で遊ぶ</a>
<p id="error" class="error"></p>
<section id="landing">
 <div class="panel"><h2 data-i="connect">オンラインルーム</h2><p data-i="intro">友達と別々の端末から同じルームに参加できます。</p><div class="field"><label data-i="name">ニックネーム</label><input id="nickname" maxlength="24" value="Player" autocomplete="nickname"></div><div class="actions"><button id="create" class="primary" data-i="create">ルームを作る</button></div><div class="field"><label data-i="codeInput">6文字のルームコード</label><input id="joinCode" maxlength="6" placeholder="ABC123" autocapitalize="characters"></div><button id="join" class="secondary" data-i="join">ルームに参加</button></div>
 <p class="muted" data-i="soloNote">1人用はローカル版から遊べます。オンラインは2〜10人用です。</p>
</section>
<section id="room" class="hide">
 <div class="panel" id="roomLobbyPanel"><div class="row"><div><div class="muted" data-i="roomCode">ルームコード</div><div id="roomCode" class="code"></div></div><button id="copy" class="secondary" data-i="copy">招待をコピー</button></div><div class="notice" data-i="shareNote">このコードを友達に送って、同じルームに入ってもらおう。</div><div class="row"><strong id="membersLabel"></strong><span id="hostBadge" class="pill"></span></div><div id="members" class="list"></div></div>
 <div id="hostSetup" class="panel hide"><h2 data-i="selectGame">ゲームを選ぶ</h2><button class="gamecard active" data-game="multi" id="gMulti"><span data-i="multi">ピタリスト</span><small data-i="multiDesc">目標時間に一番近い人が勝ち！</small></button><button class="gamecard" data-game="bomb" id="gBomb"><span data-i="bomb">タイムボム</span><small data-i="bombDesc">時間をつないで、爆発させたら負け！</small></button><button class="gamecard" data-game="guess" id="gGuess"><span data-i="guess">タイムゲス</span><small data-i="guessDesc">ランダムな時間を予想しよう！</small></button><div id="timeSetup" class="field"><label data-i="timeLabel">目標・制限時間（秒）</label><input id="target" type="number" step="0.1" min="0.1" max="9999.9" value="10.0"><div class="time-controls"><button data-adj="-1">−1</button><button data-adj="-0.1">−0.1</button><button data-adj="0.1">+0.1</button><button data-adj="1">+1</button></div></div><button class="primary" id="launch" data-i="launch">ゲームスタート</button></div>
 <div class="panel hide" id="playPanel"><div class="center"><div id="gameHeading" class="lime"></div><p id="turnLine" class="muted"></p><div class="big" id="readout"></div><p id="caption" class="hint"></p><button id="orb" class="orb">START</button><p id="turnHint" class="hint"></p></div><div id="playActions" class="actions"></div></div>
 <div id="resultPanel" class="panel hide"><h2 id="resultTitle"></h2><p id="resultHint" class="muted"></p><div id="results"></div><div class="actions"><button id="reset" class="primary" data-i="again">もう一度遊ぶ</button><button id="backTitle" class="secondary" data-i="backTitle">タイトルに戻る</button></div></div>
 <div class="actions"><button id="leave" class="secondary" data-i="leave">ルームから退出</button></div>
</section>
<script src="./firebase-config.js"></script>
<script type="module" src="./online.js"></script>
</main></body></html>
