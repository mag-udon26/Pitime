</div></section>

</main><script>
(()=>{'use strict';
const locale={

en:{soloTitle:'Time Perfect',soloMode:'Solo',soloDesc:'How close can you get to the time in your head?',multiTitle:'Time Perfect',multiMode:'2–10 players',multiDesc:'Aim for the same target time. The closest player wins!',bombTitle:'Time Bomb',bombMode:'2–10 players',bombDesc:'Keep the timer going. Set off the bomb and you lose!',guessTitle:'Time Guess',guessMode:'Any number of players',guessDesc:'The timer stops at random. Guess how many seconds passed!',back:'← Back to games',backShort:'Main menu',playerCount:'Players (2–10)',increments:'Set time in 0.1-second increments',gameStart:'Start game',targetLabel:'Target time (seconds)',bombLabel:'Time limit (seconds)',multiHint:'Choose players and a target time.',bombHint:'Choose players and the time limit.',timeError:'Enter 0.1–9999.9 seconds in 0.1-second increments.',countError:'Enter 2–10 players.',round:(i,n)=>`PLAYER ${i} / ${n}`,multiPlay:t=>`Target ${t}s`,bombPlay:t=>`Time limit ${t}s`,multiPlayHint:'Tap to start. Tap again to stop.',bombPlayHint:'Take turns tapping. Whoever triggers the bomb loses!',guessPlayHint:'Tap the circle to stop at a random time.',second:'s',retry:'Try again',again:'Play again',finished:'FINISH',guessWait:'Everyone, make your guesses!',reveal:'Reveal time',gameOver:'GAME OVER',loser:i=>`Player ${i} loses!`,safe:'SAFE!',next:'Next player',logs:'View all turns',ranking:'See rankings',rankingTitle:'Rankings',bombResultHint:t=>`Limit ${t}s · The last player loses`,multiResultHint:t=>`Closest to the ${t}s target`,total:'Total',diff:'Diff',turn:(i,p)=>`Turn ${i} · P${p}`,rank:(i,p)=>`#${i} · P${p}`,timeDiff:(sec,d)=>`${sec}s (Δ ${d>=0?'+':''}${d.toFixed(2)}s)`}
};
let lang='ja',game='solo',players=1,target=10,index=0,logs=[],phase='idle',started=0,elapsed=0,accum=0,timer=null,guessRevealed=false;
const $=id=>document.getElementById(id),fmt=n=>Number(n).toFixed(2),t=()=>locale[lang];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));scrollTo(0,0)}
function clean(){clearTimeout(timer);timer=null;phase='idle'}
function actionsClear(){$('playActions').replaceChildren()}
function action(label,fn,secondary=false){let b=document.createElement('button');b.className=secondary?'secondary':'primary';b.textContent=label;b.addEventListener('click',fn);$('playActions').append(b)}
function renderStatic(){document.documentElement.lang=lang;$('brandTitle').innerHTML=lang==='ja'?'ぴた<span class="lime">秒</span>':'Pi<span class="lime">TIME</span>';document.title=lang==='ja'?'ぴた秒':'PiTIME';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t()[el.dataset.t]);$('langJa').classList.toggle('selected',lang==='ja');$('langEn').classList.toggle('selected',lang==='en');$('targetLabel').textContent=t()[game==='bomb'?'bombLabel':'targetLabel'];$('setupTitle').textContent=t()[game==='bomb'?'bombTitle':'multiTitle'];$('setupHint').textContent=t()[game==='bomb'?'bombHint':'multiHint'];$('again').textContent=t().again;
if(document.getElementById('play').classList.contains('active')){const wasRunning=phase==='running',wasDone=phase==='done',savedTime=$('time').textContent;const caption=$('timeCaption').textContent;renderPlayHeader();if(wasRunning){$('orb').textContent=game==='guess'?'STOP':'STOP'}else if(wasDone){$('time').textContent=(game==='solo'||(game==='guess'&&guessRevealed))?fmt(elapsed)+' '+t().second:savedTime;if(game==='bomb'&&accum>=target){$('orb').textContent=t().gameOver;$('timeCaption').textContent=t().loser(index+1)}else if(game==='bomb'){$('orb').textContent=t().safe}else $('orb').textContent=t().finished;renderDoneActions()}else $('orb').textContent='START';if(game==='guess'&&wasDone&&!guessRevealed)$('timeCaption').textContent=t().guessWait;}
if(document.getElementById('results').classList.contains('active'))results();}
function changeLang(next){lang=next;renderStatic()}
function setup(g){clean();game=g;if(g==='solo'||g==='guess'){target=0;players=1;index=0;logs=[];accum=0;prepare();show('play');return}renderStatic();show('setup')}
function adjust(step){let current=Number($('target').value);if(!Number.isFinite(current))current=0;let val=Math.round((current+step)*10)/10;val=Math.min(9999.9,Math.max(.1,val));$('target').value=val.toFixed(1)}
function begin(){if(game==='multi'||game==='bomb'){const raw=Number($('target').value),n=Number($('count').value);if(!$('target').value.trim()||!Number.isFinite(raw)||raw<.1||raw>9999.9||Math.abs(raw*10-Math.round(raw*10))>1e-7){alert(t().timeError);return}if(!Number.isInteger(n)||n<2||n>10){alert(t().countError);return}target=Math.round(raw*10)/10;players=n}index=0;logs=[];accum=0;prepare();show('play')}
function renderPlayHeader(){$('round').textContent=game==='guess'?'TIME GUESS':game==='solo'?'SOLO':t().round(index+1,players);$('playTitle').textContent=game==='solo'?t().soloTitle:game==='guess'?t().guessTitle:game==='multi'?t().multiPlay(target.toFixed(1)):t().bombPlay(target.toFixed(1));$('playHint').textContent=game==='multi'?t().multiPlayHint:game==='bomb'?t().bombPlayHint:game==='guess'?t().guessPlayHint:''}
function prepare(){clean();elapsed=0;guessRevealed=false;const orb=$('orb');orb.disabled=false;orb.classList.remove('running','exploded');orb.textContent='START';renderPlayHeader();$('time').textContent='';$('timeCaption').textContent='';actionsClear()}
function press(){if(phase==='idle'){phase='running';started=performance.now();$('orb').classList.add('running');$('orb').textContent='STOP';$('time').textContent='';$('timeCaption').textContent='';if(game==='guess'){$('orb').disabled=true;const delay=200+Math.random()*9800;timer=setTimeout(()=>finish((performance.now()-started)/1000),delay)}return}if(phase==='running'&&game!=='guess')finish((performance.now()-started)/1000)}
function revealGuess(){guessRevealed=true;$('time').textContent=fmt(elapsed)+' '+t().second;$('timeCaption').textContent='';renderDoneActions()}
function renderDoneActions(){actionsClear();if(game==='solo'||game==='guess'&&guessRevealed){action(t().retry,begin);action(t().backShort,()=>show('home'),true);return}if(game==='guess'){action(t().reveal,revealGuess);return}if(game==='bomb'){if(accum>=target)action(t().logs,results);else action(t().next,prepare);return}if(logs.length<players)action(t().next,prepare);else action(t().ranking,results)}

if(game==='guess'){$('time').textContent='??.??';$('timeCaption').textContent=t().guessWait;renderDoneActions();return}
if(game==='bomb'){accum+=elapsed;logs.push({player:index+1,time:elapsed,total:accum});$('time').textContent='';if(accum>=target){$('orb').textContent=t().gameOver;$('orb').classList.add('exploded');$('timeCaption').textContent=t().loser(index+1)}else{$('orb').textContent=t().safe;index=(index+1)%players}renderDoneActions();return}
logs.push({player:index+1,time:elapsed});$('time').textContent='';$('timeCaption').textContent='';if(index<players-1)index++;renderDoneActions()}

rows.forEach((r,i)=>{const e=document.createElement('div');e.className='entry';const a=document.createElement('span');a.className='entry-player';if(game==='bomb'){a.textContent=t().turn(i+1,r.player)+(i===rows.length-1?' 💥':'');const wrap=document.createElement('div');wrap.className='bomb-row';const total=document.createElement('div'),diff=document.createElement('div');total.className='bomb-total';diff.className='bomb-diff';const l=document.createElement('small'),rlabel=document.createElement('small');l.textContent=t().total;rlabel.textContent=t().diff;total.append(l,document.createTextNode(fmt(r.total)+t().second));diff.append(rlabel,document.createTextNode((r.total-target>=0?'+':'')+fmt(r.total-target)+t().second));wrap.append(total,diff);e.append(a,wrap)}else{a.textContent=t().rank(i+1,r.player);const b=document.createElement('strong');b.textContent=t().timeDiff(fmt(r.time),r.time-target);if(i===0)b.className='highlight';e.append(a,b)}$('resultList').append(e)});show('results')}
document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>setup(b.dataset.game)));document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{clean();show('home')}));document.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click',()=>adjust(Number(b.dataset.adjust))));$('start').addEventListener('click',begin);$('orb').addEventListener('click',press);$('again').addEventListener('click',begin);$('langJa').addEventListener('click',()=>changeLang('ja'));$('langEn').addEventListener('click',()=>changeLang('en'));renderStatic();
})();</script></body></html>
